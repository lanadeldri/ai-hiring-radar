name: Refresh job data

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~8am Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # first run scans ~2,000 company sites; later runs reuse a weekly cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the pre-push rebase has a merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover new AI companies (HN Who's Hiring, YC, funding news)
        run: python discover.py --auto-add
        continue-on-error: true
      - name: Fetch open roles
        run: python fetch_jobs.py --detect
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --cached --quiet && exit 0
          git commit -m "Refresh job data $(date -u +%F)"
          # someone may have pushed while this ran (code changes, hand-edited CSVs):
          # replay our data commit on top, keeping this run's fresh data on conflicts
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
